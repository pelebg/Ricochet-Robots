<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ricochet-like</title>

<style>
/* =======================
   THEME / VARIABLES
======================= */
:root{
  --bg0:#070A12;
  --bg1:#0B1024;
  --stroke: rgba(255,255,255,.14);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.65);

  --cell: 44px;
  --gap: 3px;

  --shadow: 0 18px 50px rgba(0,0,0,.45);

  --glowR: 0 0 22px rgba(255,70,70,.45);
  --glowB: 0 0 22px rgba(80,160,255,.45);
  --glowG: 0 0 22px rgba(70,220,150,.45);
  --glowY: 0 0 22px rgba(255,210,90,.45);
}

/* =======================
   BASE
======================= */
*{ box-sizing:border-box; }

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:var(--text);
  background:
    radial-gradient(1200px 800px at 20% 10%, rgba(120,90,255,.25), transparent 55%),
    radial-gradient(900px 700px at 85% 20%, rgba(0,210,255,.20), transparent 55%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
}

.page{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

h1{
  margin:0 0 6px;
  font-size:20px;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

/* =======================
   LAYOUT
======================= */
.wrap{
  display:grid;
  grid-template-columns:auto 360px;
  gap:16px;
}

/* =======================
   BOARD
======================= */
#board{
  display:grid;
  grid-template-columns:repeat(16,var(--cell));
  grid-auto-rows:var(--cell);
  gap:var(--gap);
  padding:14px;
  border-radius:18px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 10px),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
}

.cell{
  position:relative;
  border-radius:12px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.15), rgba(0,0,0,.15) 75%);
  border:1px solid rgba(255,255,255,.10);
}

.cell.dark{
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.10), rgba(0,0,0,.20) 80%);
}

/* WALLS */
.wallT::before,.wallB::before,.wallL::before,.wallR::before{
  content:"";
  position:absolute;
  background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.6));
}
.wallT::before{top:-3px;left:6px;right:6px;height:8px;border-radius:99px;}
.wallB::before{bottom:-3px;left:6px;right:6px;height:8px;border-radius:99px;}
.wallL::before{left:-3px;top:6px;bottom:6px;width:8px;border-radius:99px;}
.wallR::before{right:-3px;top:6px;bottom:6px;width:8px;border-radius:99px;}

/* TARGET */
.target{
  position:absolute;
  inset:8px;
  border-radius:12px;
  border:2px dashed rgba(255,255,255,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  background:radial-gradient(circle, rgba(0,255,255,.18), rgba(0,0,0,.20));
  box-shadow:0 0 25px rgba(0,255,255,.25);
}

/* ROBOTS */
.robot{
  position:absolute;
  inset:7px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:white;
  cursor:pointer;
  box-shadow:
    0 14px 24px rgba(0,0,0,.45),
    inset 0 2px 2px rgba(255,255,255,.25),
    inset 0 -10px 20px rgba(0,0,0,.35);
}

.robot::after{
  content:"";
  position:absolute;
  inset:6px 8px 16px 8px;
  border-radius:999px;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.6), transparent 60%);
}

.robot.sel{
  outline:2px solid white;
  outline-offset:2px;
}

/* =======================
   SIDE PANEL
======================= */
.side{
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  padding:14px;
  box-shadow:var(--shadow);
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

button{
  padding:10px 12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.20);
  background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
  color:white;
  cursor:pointer;
}

button:hover{ filter:brightness(1.1); }

.log{
  font-family:monospace;
  font-size:12px;
  background:rgba(0,0,0,.35);
  border-radius:14px;
  padding:12px;
  height:160px;
  overflow:auto;
}

/* RESPONSIVE */
@media(max-width:980px){
  .wrap{ grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="page">
  <h1>Ricochet-like</h1>
  <div class="subtitle">Jeu de logique inspiré de Ricochet Robots</div>

  <div class="wrap">
    <div id="board"></div>

    <div class="side">
      <div class="row">
        <button onclick="newTarget()">Nouvelle cible</button>
        <button onclick="reset()">Reset</button>
      </div>
      <div class="row">
        Coups : <span id="moves">0</span>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
/* =======================
   GAME LOGIC
======================= */
const W=16,H=16;
const board=document.getElementById("board");
const movesEl=document.getElementById("moves");
const logEl=document.getElementById("log");

let moves=0;
let selected=0;

const robots=[
  {id:0,c:"#e74c3c",x:1,y:1},
  {id:1,c:"#3498db",x:14,y:1},
  {id:2,c:"#2ecc71",x:1,y:14},
  {id:3,c:"#f1c40f",x:14,y:14},
];

let target={x:8,y:8};

function idx(x,y){return y*W+x;}

const walls=Array(W*H).fill(0);
function wall(x,y,d){
  const m={T:1,R:2,B:4,L:8}[d];
  walls[idx(x,y)]|=m;
}

/* borders */
for(let i=0;i<W;i++){wall(i,0,"T");wall(i,H-1,"B");}
for(let i=0;i<H;i++){wall(0,i,"L");wall(W-1,i,"R");}

function render(){
  board.innerHTML="";
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement("div");
    c.className="cell"+(((x+y)&1)?" dark":"");
    const m=walls[idx(x,y)];
    if(m&1)c.classList.add("wallT");
    if(m&2)c.classList.add("wallR");
    if(m&4)c.classList.add("wallB");
    if(m&8)c.classList.add("wallL");

    if(x===target.x&&y===target.y){
      const t=document.createElement("div");
      t.className="target";
      t.textContent="★";
      c.appendChild(t);
    }

    robots.forEach(r=>{
      if(r.x===x&&r.y===y){
        const d=document.createElement("div");
        d.className="robot"+(r.id===selected?" sel":"");
        d.style.background=r.c;
        d.style.boxShadow+=
          r.id===0?",var(--glowR)":
          r.id===1?",var(--glowB)":
          r.id===2?",var(--glowG)":
                    ",var(--glowY)";
        d.textContent=r.id+1;
        d.onclick=()=>{selected=r.id;render();}
        c.appendChild(d);
      }
    });
    board.appendChild(c);
  }
  movesEl.textContent=moves;
}

function move(dx,dy){
  const r=robots[selected];
  while(true){
    const nx=r.x+dx,ny=r.y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H)break;
    if(robots.some(o=>o!==r&&o.x===nx&&o.y===ny))break;
    r.x=nx;r.y=ny;
  }
  moves++;
  render();
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")move(0,-1);
  if(e.key==="ArrowDown")move(0,1);
  if(e.key==="ArrowLeft")move(-1,0);
  if(e.key==="ArrowRight")move(1,0);
});

function newTarget(){
  target={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};
  moves=0;
  render();
}

function reset(){
  robots[0].x=1;robots[0].y=1;
  robots[1].x=14;robots[1].y=1;
  robots[2].x=1;robots[2].y=14;
  robots[3].x=14;robots[3].y=14;
  moves=0;
  render();
}

render();
</script>
</body>
</html>
